services:
  registry:
    image: registry:2
    container_name: tp13_registry
    ports:
      - "${REGISTRY_BIND_IP}:${REGISTRY_PORT}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "[http://${REGISTRY_PUBLIC_HOST}:${REGISTRY_UI_PORT},http://127.0.0.1:${REGISTRY_UI_PORT}]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "[HEAD,GET,OPTIONS,DELETE]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "[Authorization,Accept,Cache-Control]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: "[true]"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "[Docker-Content-Digest]"
    volumes:
      - registry_data:/var/lib/registry
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: tp13_registry_ui
    ports:
      - "${REGISTRY_UI_BIND_IP}:${REGISTRY_UI_PORT}:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "TP13 Private Registry"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      NGINX_RESOLVER: "127.0.0.11"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      - registry
    restart: unless-stopped

volumes:
  registry_data:
