name: TP13 Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: mon-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA and lowercase GHCR owner
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
          echo "IMAGE_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Build API image
        run: |
          docker build \
            -t "${IMAGE_NAME}:git-${SHORT_SHA}" \
            -f api/Dockerfile \
            api

      - name: Scan image with Trivy (CRITICAL only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:git-${{ env.SHORT_SHA }}"
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        run: |
          TARGET_IMAGE="ghcr.io/${IMAGE_OWNER_LC}/${IMAGE_NAME}:git-${SHORT_SHA}"
          docker tag "${IMAGE_NAME}:git-${SHORT_SHA}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"
          echo "Pushed ${TARGET_IMAGE}"
