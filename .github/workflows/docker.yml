name: TP13 Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: mon-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA and lowercase GHCR owner
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"
          echo "IMAGE_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Build API image
        run: |
          docker build \
            -t "${IMAGE_NAME}:git-${SHORT_SHA}" \
            -f api/Dockerfile \
            api

      - name: Scan image with Trivy (CRITICAL only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:git-${{ env.SHORT_SHA }}"
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        run: |
          TARGET_IMAGE="ghcr.io/${IMAGE_OWNER_LC}/${IMAGE_NAME}:git-${SHORT_SHA}"
          docker tag "${IMAGE_NAME}:git-${SHORT_SHA}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"
          echo "TARGET_IMAGE=${TARGET_IMAGE}" >> "${GITHUB_ENV}"
          echo "Pushed ${TARGET_IMAGE}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            export GIT_SHA="${{ env.SHORT_SHA }}"
            set -a
            . ./.env
            set +a
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.IMAGE_OWNER_LC }}" --password-stdin
            fi
            docker compose --env-file .env -f docker-compose.prod.yml pull cat dog
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
            echo "Deployed ghcr.io/${{ env.IMAGE_OWNER_LC }}/${{ env.IMAGE_NAME }}:git-${GIT_SHA}"
            curl -sf "http://127.0.0.1:${NGINX_PORT}/"
            echo "Smoke test OK"
